# fly launch --copy-config --no-deploy, then:
#   fly volumes create forms_data --size 1
#   fly secrets set FORMS_ADMIN_PASSWORD=... FORMS_PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
app = "my-forms"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  FORMS_DATA_DIR = "/data"

[mounts]
  source = "forms_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
